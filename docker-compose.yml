version: '3.8'
services:
  DockerServer:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Admin123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Admin123! -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  eventosapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=DockerServer,1433;Database=GestionEventos;User Id=sa;Password=Admin123!;TrustServerCertificate=True;
      - Redis__Configuration=redis:6379
    depends_on:
      DockerServer:
        condition: service_healthy
    ports:
      - "5000:80"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      - eventosapi
      - redis
    ports:
      - "5001:80"

volumes:
  sqlserver_data:
